# .github/workflows/ci.yml
# CI pipeline for StopPhishingDotCom
# Runs automatically on every push and pull request to main.
# Three jobs: backend tests (with a real Postgres + Redis), frontend build,
# and a Docker Compose build check.
#
# NOTE: the CI database password is pulled from a GitHub Secret
# (secrets.CI_DB_PASSWORD) instead of being written in plaintext.
# Set it once under: repo Settings -> Secrets and variables -> Actions -> New repository secret.

name: CI

on:
  push:
    branches: [ main, my-additions ]
  pull_request:
    branches: [ main ]

jobs:

  # ==========================================================================
  # JOB 1 — Backend: install deps, run migrations, run pytest
  # ==========================================================================
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stopphish
          # ${{ secrets.CI_DB_PASSWORD }} = read the value from the repo's GitHub Secret.
          # Never printed in logs; GitHub masks it automatically.
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: stopphishing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stopphish"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # The SAME secret is reused here so the connection string matches the DB above.
    env:
      DATABASE_URL: postgresql://stopphish:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/stopphishing
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head || true

      - name: Run tests
        working-directory: backend
        run: pytest -q

  # ==========================================================================
  # JOB 2 — Frontend: make sure the Vue app builds
  # ==========================================================================
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ==========================================================================
  # JOB 3 — Docker: verify the whole stack builds from docker-compose.yml
  # ==========================================================================
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build